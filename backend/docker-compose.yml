version: '3.8'

services:
  # PostgreSQL Cloud-Parity Relational Database
  db:
    image: postgres:15-alpine
    container_name: smart_attendance_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_attendance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API & Biometrics Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_attendance_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-smart_attendance}
      SECRET_KEY: ${SECRET_KEY:-super_secret_enterprise_jwt_key_2026}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

volumes:
  postgres_data:
