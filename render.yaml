# ==============================================================================
# Production Deployment Specification - Smart Attendance AI Backend
# Cloud-native deployment manifest for Render Cloud & Container orchestration
# ==============================================================================

services:
  - type: web
    name: smart-attendance-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://student-portal-one-ruby.vercel.app,https://admin-portal-eta-lilac.vercel.app,https://web-frontend-five-gray.vercel.app,https://hod-portal.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      - key: DEFAULT_HOD_PASSWORD
        value: admin123
      - key: DEFAULT_TEACHER_PASSWORD
        value: teacher123
      - key: DEFAULT_STUDENT_PASSWORD
        value: Student@Secure2026!
